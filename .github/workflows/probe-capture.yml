name: Test flux La Tribune (temporaire)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Linux; Android 14) Chrome/124 Mobile"
          for f in rss/actualites rss/tech rss/tech/telecoms rss/telecoms rss/economie rss/entreprises-finance rss/latest rss/all rss/derniere-minute sitemaps/sitemap-news.xml; do printf "%-28s " "$f"; curl -sL -A "$UA" -o t.xml -w "%{http_code} %{url_effective} %{content_type} " "https://www.latribune.fr/$f"; echo "items=$(grep -o '<item' t.xml | wc -l) urls=$(grep -o '<url>' t.xml | wc -l) starlink=$(grep -ci starlink t.xml)"; done
          curl -sL -A "$UA" https://www.latribune.fr/sitemaps/sitemap-news.xml | head -c 1500
