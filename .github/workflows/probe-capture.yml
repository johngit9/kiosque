name: Test flux La Tribune (temporaire)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Linux; Android 14) Chrome/124 Mobile"
          curl -sL -A "$UA" https://www.latribune.fr/sitemaps/sitemap.xml -o idx.xml; wc -c idx.xml; grep -o '<loc>[^<]*' idx.xml | head -20; grep -c '<loc>' idx.xml
          L=$(grep -o '<loc>[^<]*' idx.xml | sed 's/<loc>//' | grep -iv "static\|categ\|tag\|author" | tail -3)
          for u in $(grep -o '<loc>[^<]*' idx.xml | sed 's/<loc>//' | head -3) $L; do echo "== $u"; curl -sL -A "$UA" "$u" -o s.xml; echo "urls=$(grep -o '<url>' s.xml | wc -l) starlink=$(grep -ci starlink s.xml) telecoms=$(grep -c 'tech/telecoms' s.xml)"; head -c 700 s.xml; echo; done
