name: Appli Android (APK)

on:
  push:
    branches: [main]
    paths: ["www/**", "assets/**", "ci/**", "capacitor.config.json", "package.json", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Installer Capacitor
        run: npm install
      - name: Générer le projet Android
        run: |
          npx cap add android
          # Notifications en arrière-plan (@capacitor/background-runner)
          sed -i "s#dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'#dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs', '../../node_modules/@capacitor/background-runner/android/src/main/libs'#" android/app/build.gradle
          grep -q "background-runner/android/src/main/libs" android/app/build.gradle
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS android/app/src/main/AndroidManifest.xml
          echo "kotlin.jvm.target.validation.mode=warning" >> android/gradle.properties
          npx capacitor-assets generate --android
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/" www/index.html
          npx cap sync android
      - name: Clé de signature fixe (pour pouvoir mettre l'appli à jour sans la désinstaller)
        run: mkdir -p ~/.android && cp ci/debug.keystore ~/.android/debug.keystore
      - name: Construire l'APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Renommer
        run: cp android/app/build/outputs/apk/debug/app-debug.apk kiosque.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kiosque-apk
          path: kiosque.apk
      - name: Publier dans les Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android --yes --cleanup-tag || true
          gh release create android kiosque.apk --title "Kiosque pour Android" --notes "APK construit automatiquement depuis le commit ${GITHUB_SHA::7}. Téléchargez kiosque.apk sur votre téléphone puis ouvrez-le pour l'installer." --latest
