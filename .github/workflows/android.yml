name: Appli Android (APK)

# Construction automatique arrêtée depuis la v36 : les versions livrées (dossier apk/) contiennent le module
# natif PageShot (android-plugin/) et sont signées avec une autre clé que ci/debug.keystore.
# Un APK construit ici ne pourrait pas s'installer par-dessus. Lancement manuel seulement.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Installer Capacitor
        run: npm install
      - name: Bloqueur de pubs et traqueurs du lecteur intégré
        run: python3 ci/patch-iab.py && grep -q KiosqueBlock node_modules/cordova-plugin-inappbrowser/src/android/InAppBrowser.java
      - name: Générer le projet Android
        run: |
          npx cap add android
          # Notifications en arrière-plan (@capacitor/background-runner)
          sed -i "s#dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'#dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs', '../../node_modules/@capacitor/background-runner/android/src/main/libs'#" android/app/build.gradle
          grep -q "background-runner/android/src/main/libs" android/app/build.gradle
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS android/app/src/main/AndroidManifest.xml
          echo "kotlin.jvm.target.validation.mode=warning" >> android/gradle.properties
          npx capacitor-assets generate --android
          sed -i "s/__BUILD__/1.${GITHUB_RUN_NUMBER}/; s/__COMMIT__/${GITHUB_SHA::7}/" www/index.html
          npx cap sync android
          # Numéro de version visible dans Android (Paramètres → Applis → Kiosque)
          sed -i "s/versionCode 1$/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"1.0\"/versionName \"1.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
          grep -q "versionName \"1.${GITHUB_RUN_NUMBER}\"" android/app/build.gradle
      - name: Clé de signature fixe (pour pouvoir mettre l'appli à jour sans la désinstaller)
        run: |
          mkdir -p ~/.android && cp ci/debug.keystore ~/.android/debug.keystore
          # Signature explicite avec la clé du dépôt, quel que soit le dossier Android du serveur
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile rootProject.file('../ci/debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          GRADLE
      - name: Construire l'APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Renommer et vérifier la signature
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk kiosque.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs kiosque.apk | tee cert.txt
          grep -qi "fd959ac0c7a6ac3684e386acd910e8819f945a5b9d9bc42c5408ef718f4e8e18" cert.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kiosque-apk
          path: kiosque.apk
      - name: Publier dans les Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android --yes --cleanup-tag || true
          gh release create android kiosque.apk --title "Kiosque 1.${GITHUB_RUN_NUMBER}" --notes "${GITHUB_SHA::7} · Version 1.${GITHUB_RUN_NUMBER} de Kiosque, construite automatiquement. Téléchargez kiosque.apk sur votre téléphone puis ouvrez-le pour l'installer." --latest
