name: Test V37 Android

on:
  push:
    branches: [feat/v37-ui-validee]
    paths:
      - 'www/**'
      - 'package.json'
      - 'capacitor.config.*'
      - 'ci/**'
      - '.github/workflows/v37-test.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Appliquer l’interface V37 validée
        run: python3 ci/v37-ui-patch.py
      - name: Installer les dépendances
        run: npm install
      - name: Vérifier le patch du navigateur intégré
        run: python3 ci/patch-iab.py && grep -q KiosqueBlock node_modules/cordova-plugin-inappbrowser/src/android/InAppBrowser.java
      - name: Générer le projet Android
        run: |
          npx cap add android
          sed -i "s#dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'#dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs', '../../node_modules/@capacitor/background-runner/android/src/main/libs'#" android/app/build.gradle
          grep -q "background-runner/android/src/main/libs" android/app/build.gradle
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          echo "kotlin.jvm.target.validation.mode=warning" >> android/gradle.properties
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Compiler l’APK V37 release non signé
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Préparer apksigner pour Mac ARM64
        run: |
          BT="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          mkdir -p apk-tools/lib
          cp "$ANDROID_HOME/build-tools/$BT/lib/apksigner.jar" apk-tools/lib/
          cat > apk-tools/apksigner <<'EOF'
          #!/bin/sh
          SCRIPT_DIR="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec java -jar "$SCRIPT_DIR/lib/apksigner.jar" "$@"
          EOF
          chmod +x apk-tools/apksigner
          echo "$BT" > apk-tools/build-tools-version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kiosque-v37-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: apksigner-mac-arm64
          path: apk-tools/
          if-no-files-found: error
