name: Vérifier des flux RSS

on:
  push:
    branches: [main]
    paths: ["scripts/feed-candidates.json", "scripts/check-feeds.mjs"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-feeds.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: feed-check
          path: feed-check.json
